# Lint for the six Python workspace members. Run: uvx ruff@0.17.3 check
# The marked legacy baseline may only shrink. Do not add ignores for new code.
required-version = "==0.17.3"
target-version = "py311"

include = [
  "storage/**/*.py",
  "agent/**/*.py",
  "api/**/*.py",
  "worker/**/*.py",
  "cli/**/*.py",
  "admin/**/*.py",
]

extend-exclude = ["tests", "*/tests"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "B", "PLE"]

